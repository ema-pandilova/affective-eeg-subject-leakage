<title>Audit Coding Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root{
  --ground:#EDF0EF; --panel:#FFFFFF; --panel-2:#F5F7F6; --ink:#15202A; --muted:#56626C; --faint:#7B868D;
  --rule:#D6DCDA; --rule-strong:#B8C2BE;
  --coderA:#1D5FA6; --coderA-soft:#E2EBF6; --coderB:#9E4F1B; --coderB-soft:#F5E7DC;
  --adj:#5A4698; --adj-soft:#EBE7F5; --coord:#2C5B4E; --coord-soft:#DFEBE6;
  --ok:#2B764A; --ok-soft:#DFEFE5; --bad:#AD352C; --bad-soft:#F6E1DE; --warn:#855F0E; --warn-soft:#F4EBD4;
  --on-role:#FFFFFF;
  --shadow:0 1px 2px rgba(21,32,42,.06),0 8px 24px rgba(21,32,42,.07);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --role:var(--coord); --role-soft:var(--coord-soft);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1316; --panel:#151C20; --panel-2:#1A2327; --ink:#E3E9E7; --muted:#A0ACA8; --faint:#7F8B88;
    --rule:#29343A; --rule-strong:#3B4950;
    --coderA:#7DB1EC; --coderA-soft:#19293A; --coderB:#E59C69; --coderB-soft:#33241A;
    --adj:#B1A2EC; --adj-soft:#26213A; --coord:#84C4AE; --coord-soft:#17302A;
    --ok:#66C28D; --ok-soft:#163125; --bad:#F0877C; --bad-soft:#3A1D1A; --warn:#E3B858; --warn-soft:#332913;
    --on-role:#0E1316; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1316; --panel:#151C20; --panel-2:#1A2327; --ink:#E3E9E7; --muted:#A0ACA8; --faint:#7F8B88;
  --rule:#29343A; --rule-strong:#3B4950;
  --coderA:#7DB1EC; --coderA-soft:#19293A; --coderB:#E59C69; --coderB-soft:#33241A;
  --adj:#B1A2EC; --adj-soft:#26213A; --coord:#84C4AE; --coord-soft:#17302A;
  --ok:#66C28D; --ok-soft:#163125; --bad:#F0877C; --bad-soft:#3A1D1A; --warn:#E3B858; --warn-soft:#332913;
  --on-role:#0E1316; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
body[data-role="A"]{--role:var(--coderA);--role-soft:var(--coderA-soft)}
body[data-role="B"]{--role:var(--coderB);--role-soft:var(--coderB-soft)}
body[data-role="adj"]{--role:var(--adj);--role-soft:var(--adj-soft)}
body[data-role="coord"]{--role:var(--coord);--role-soft:var(--coord-soft)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topH,120px) + 12px);scroll-padding-bottom:80px}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1240px;margin-inline:auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--role)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--role);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--rule);margin-inline:-16px;padding-inline:16px}
.top-in{max-width:1240px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.conn.live i{background:var(--ok)} .conn.off i{background:var(--warn)}
.rolepill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--role);background:var(--role-soft);color:var(--ink);border-radius:999px;padding:4px 6px 4px 12px;font-size:13.5px}
.rolepill strong{color:var(--role);font-weight:600}
.rolepill button{border:0;background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.rolepill button:hover{color:var(--ink)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;width:100%;border-top:1px solid var(--rule);padding-top:8px}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 -2px 0 var(--role)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.tabs .count{font-family:var(--mono);font-size:11.5px;margin-left:6px;color:var(--faint)}

/* generic */
main{padding-block:20px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--role);background:var(--role);color:var(--on-role);padding:8px 14px;border-radius:8px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
.btn.ghost:hover{border-color:var(--role);filter:none}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 10px;font-size:13px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input[type="text"],input[type="number"],input[type="password"],select,textarea{background:var(--panel);border:1px solid var(--rule-strong);border-radius:7px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.45}
input:disabled,textarea:disabled,select:disabled{background:var(--panel-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);background:var(--panel-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.role{background:var(--role-soft);border-color:transparent;color:var(--role)}
.note{border-left:3px solid var(--role);background:var(--role-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.tblwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--panel-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* role picker */
.intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.intro h1{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.015em;line-height:1.12}
.intro p.lead{margin-top:12px;color:var(--muted);max-width:60ch}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rolecard{--c:var(--coord);--cs:var(--coord-soft);text-align:left;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px}
.rolecard:hover{border-color:var(--c);box-shadow:var(--shadow)}
.rolecard .rk{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--c)}
.rolecard .rk i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.rolecard .nm{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink)}
.rolecard .ds{font-size:13px;color:var(--muted)}
.rolecard.A{--c:var(--coderA)} .rolecard.B{--c:var(--coderB)} .rolecard.adj{--c:var(--adj)}
.steps{margin-top:22px;display:grid;gap:10px;counter-reset:s}
.steps div{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px}
.steps div::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:50%;border:1px solid var(--rule-strong);display:grid;place-items:center;color:var(--muted);margin-top:1px}

/* work layout */
.work{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.queue{position:sticky;top:calc(var(--topH,120px) + 12px);max-height:calc(100vh - var(--topH,120px) - 28px);display:flex;flex-direction:column}
.queue-head{padding:12px 14px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.bar{height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--rule)}
.bar b{display:block;height:100%;background:var(--role)}
.qlist{overflow:auto;padding:6px}
.qitem{display:grid;grid-template-columns:18px 1fr;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:7px;cursor:pointer;color:var(--ink)}
.qitem:hover{background:var(--panel-2)}
.qitem[aria-current="true"]{background:var(--role-soft)}
.qitem .t{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qitem .m{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--rule-strong);margin-top:3px;position:relative}
.dot.prog{border-color:var(--role);background:linear-gradient(90deg,var(--role) 50%,transparent 50%)}
.dot.done{border-color:var(--ok);background:var(--ok)}
.dot.done::after{content:"";position:absolute;left:3.5px;top:1px;width:3.5px;height:7px;border:solid var(--panel);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.qselect{display:none}
.paperhead{padding:18px 20px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.paperhead .ptitle:focus{outline:none}
.paperhead .ptitle:focus-visible{outline:2px solid var(--role);outline-offset:4px}
.paperhead .ptitle{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.28;letter-spacing:-.005em}
.paperhead .pmeta{font-size:13.5px;color:var(--muted)}
.abstract{font-size:14px;color:var(--muted);max-width:75ch;margin-top:4px}
.form{padding:6px 20px 20px}
.grp{padding-block:16px;border-bottom:1px solid var(--rule)}
.grp:last-child{border-bottom:0}
.grp > h3{display:flex;align-items:baseline;gap:10px}
.grp .gi{font-size:13.5px;color:var(--muted);margin-top:4px;max-width:75ch}
.q{margin-top:14px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px}
.q .code{font-family:var(--mono);font-size:12.5px;color:var(--role);font-weight:500;padding-top:2px}
.q .lbl{font-weight:500}
.q .lbl .pri{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule-strong);border-radius:4px;padding:0 5px;margin-left:8px;vertical-align:2px}
.q .rule{grid-column:2;font-size:13px;color:var(--muted);max-width:78ch}
.q .ctl{grid-column:2;margin-top:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--rule);border-radius:7px;padding:7px 10px;cursor:pointer;background:var(--panel);font-size:14px;line-height:1.35}
.opt:hover{border-color:var(--rule-strong)}
.opt input{margin:2px 0 0;accent-color:var(--role)}
.opt:has(input:checked){border-color:var(--role);background:var(--role-soft)}
.opt:has(input:disabled){cursor:default}
.formfoot{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--rule);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-radius:0 0 10px 10px}
.formfoot .save{margin-right:auto;font-size:13px;color:var(--muted)}
.missing{font-size:13px;color:var(--warn)}

/* compare/resolve */
.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side .sv{border-radius:8px;padding:9px 12px;font-size:14px}
.side .sv.A{background:var(--coderA-soft)} .side .sv.B{background:var(--coderB-soft)}
.side .sv .who{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:3px}
.side .sv.A .who{color:var(--coderA)} .side .sv.B .who{color:var(--coderB)}
.quote{font-family:var(--serif);font-size:14px;color:var(--muted);margin-top:6px;white-space:pre-wrap}
.ditem{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.ditem:last-child{border-bottom:0}
.kbar{display:inline-block;width:70px;height:6px;border-radius:9px;background:var(--panel-2);border:1px solid var(--rule);vertical-align:middle;margin-left:8px;overflow:hidden}
.kbar b{display:block;height:100%}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,15,18,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal textarea.dump{min-height:220px;font-family:var(--mono);font-size:12px}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}

@media (max-width:900px){
  .intro{grid-template-columns:1fr}
  .work{grid-template-columns:1fr}
  .queue{position:static;max-height:none}
  .qlist{display:none}
  .qselect{display:block}
}
@media (max-width:560px){
  .roles{grid-template-columns:1fr}
  .side{grid-template-columns:1fr}
  .q{grid-template-columns:1fr}
  .q .rule,.q .ctl{grid-column:1}
  .intro h1{font-size:28px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="top" id="top">
  <div class="top-in">
    <div class="brand"><b>Audit Coding Bench</b><span>Affective-EEG leakage audit, double coding for manuscript 1953177</span></div>
    <span class="conn" id="conn"><i></i><span>Connecting</span></span>
    <span id="rolepill"></span>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections" hidden></nav>
  </div>
</div>
<main class="wrap" id="view"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ codebook v1.1 */
const CODEBOOK_VERSION = "1.1";
const YNU = [["yes","Yes"],["no","No"],["unclear","Unclear"]];
const NORM_OPTS = [["none","None described"],["instance","Per window or per trial only (for example baseline subtraction within a trial)"],["train_only","Fit on training data only"],["participant_all","Per participant, session or recording, over all of that data"],["dataset_all","Over the whole dataset before the split"],["unclear","Mentioned, but the scope cannot be determined"]];
const TARGET_OPTS = [["none","No"],["unlabeled","Unlabeled test-participant data (domain adaptation, transductive learning)"],["labeled","Labeled test-participant data (calibration, fine-tuning, few-shot)"],["na","Not applicable"],["unclear","Unclear"]];
const CB = {
  screen: {
    groups: [{
      title: "Eligibility",
      intro: "Start from the title and abstract. Open the full text whenever the abstract does not settle one of the criteria.",
      fields: [
        {id:"E1", type:"cat", primary:true, label:"Is this study eligible for the audit sample?",
         rule:"Eligible only if all three hold: (1) a peer-reviewed primary study, meaning a journal article or a peer-reviewed conference paper, reporting its own emotion-decoding experiment; (2) at least one result from EEG alone, not EEG fused with other signals, on DEAP, DREAMER or a SEED-family dataset, which is the same test the full-text check X1 applies; (3) the full text can be obtained. Choose Unsure when you cannot decide; the adjudicator settles it.",
         options:[["eligible","Eligible"],["not_eligible","Not eligible"],["unsure","Unsure"]]},
        {id:"E2", type:"cat", when:{E1:"not_eligible"}, label:"Main reason it is not eligible",
         rule:"Pick the first reason that applies, in this order.",
         options:[["review","Review, survey or tutorial"],["no_decoding","No emotion-decoding experiment"],["frame","No EEG-only result on DEAP, DREAMER or a SEED-family dataset"],["duplicate","Duplicate or earlier version of an included study"],["not_peer_reviewed","Not peer reviewed (preprint, thesis)"],["no_full_text","Full text not obtainable"],["other","Other, explained in the note"]]},
        {id:"note", type:"text", label:"Note", rule:"Anything the adjudicator should know."}
      ]
    }]
  },
  code: {
    groups: [
      {title:"Full-text check", fields:[
        {id:"X1", type:"cat", primary:true, label:"On the full text, is this a primary emotion-decoding study with an EEG-only result on DEAP, DREAMER or a SEED-family dataset?",
         rule:"Code the version of record at the DOI. If you can only obtain another version, a preprint or an accepted manuscript, code that one and say so in the note. No for reviews, for studies of other tasks or datasets, and for studies whose only results fuse EEG with other signals. The dataset-origin papers for DEAP, DREAMER and SEED report their own EEG-only classification and are Yes. When No, say why in the note; the remaining questions are skipped.",
         options:[["yes","Yes"],["no","No"]]}
      ]},
      {title:"Headline result", when:{X1:"yes"},
       intro:"The headline result is the first performance value (accuracy, F1, AUC or similar, not an improvement over a baseline) stated in the abstract for an EEG-only emotion-decoding result on DEAP, DREAMER or a SEED-family dataset. Skip earlier values that fuse modalities or come from other datasets. If the abstract gives no such value, use the first main results table that reports one, and take the EEG-only row of the proposed method, or the best EEG-only row when the paper proposes no method, as in dataset and benchmark papers. Whenever valence and arousal are reported together, code valence.",
       fields:[
        {id:"H1", type:"cat", label:"Dataset of the headline result",
         options:[["DEAP","DEAP"],["DREAMER","DREAMER"],["SEED","SEED"],["SEED-IV","SEED-IV"],["SEED-V","SEED-V"],["SEED-VII","SEED-VII"]]},
        {id:"H2", type:"cat", label:"Task of the headline result",
         options:[["valence_binary","Valence, two classes"],["arousal_binary","Arousal, two classes"],["quadrant","Valence-arousal quadrants, four classes"],["discrete","Discrete emotion categories (for example SEED three classes)"],["other","Other"]]},
        {id:"H3", type:"cat", label:"Metric of the headline result",
         options:[["accuracy","Accuracy"],["f1","F1"],["auc","AUC"],["other","Other"]]},
        {id:"H4", type:"num", label:"Headline value",
         rule:"As printed, in the metric of H3. A percentage such as 94.5 is fine; it is converted to 0.945 for comparison. If a range or several folds are given, enter the highest value."}
      ]},
      {title:"How the headline result was evaluated", when:{X1:"yes"}, fields:[
        {id:"S1", type:"cat", label:"Evaluation design",
         rule:"Code the labeled data that trained the model before any adaptation or calibration, which T1 records separately. If the test participants were in that training data: one model per participant is Subject-dependent when the test data come from sessions also used in training, and Cross-session when the test session was not used; one model shared by several participants is Pooled, whatever the sessions. If the test participants were not in it: Participant-independent when some labeled training data came from the same dataset, including leave-one-subject-out across sessions, and Cross-dataset when none did.",

function makeDbStore(db){
  const retry = async fn => { try { return await fn(); } catch (e) { if (e && e.code === "unavailable") { await sleep(300 + Math.random() * 700); return fn(); } throw e; } };
  const onErr = e => { if (!e) return; if (e.code === "revoked") { st.revoked = true; render(); } else toast(e.code === "resource_exhausted" ? "The workspace is busy. Reload the page in a moment." : "Lost the live connection. Reload the page.", "bad"); };
  const meta = s => ({definitive: !(s && s.metadata && s.metadata.fromCache)});
  return {
    online: true,
    get: async p => { const s = await retry(() => db.doc(p).get()); return s.exists ? clone(s.data()) : null; },
    set: (p, d) => retry(() => db.doc(p).set(d)),
    del: p => retry(() => db.doc(p).delete()),
    list: async c => { const q = await retry(() => db.collection(c).limit(1000).get()); return q.docs.map(d => ({id: d.id, data: clone(d.data())})); },
    watchDoc: (p, fn) => db.doc(p).onSnapshot(s => fn(s.exists ? clone(s.data()) : null, meta(s)), onErr),
    watchCol: (c, fn) => db.collection(c).limit(1000).onSnapshot(q => fn(q.docs.map(d => ({id: d.id, data: clone(d.data())})), meta(q)), onErr)
  };
}
function makeLocalStore(){
  const PFX = "acb:", subs = new Map(), META = {definitive: true};
  const read = p => { try { const v = localStorage.getItem(PFX + p); return v ? JSON.parse(v) : null; } catch { return null; } };
  const colOf = p => p.split("/").slice(0, -1).join("/");
  const listCol = c => { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PFX + c + "/")) { const rest = k.slice(PFX.length + c.length + 1); if (!rest.includes("/")) out.push({id: rest, data: JSON.parse(localStorage.getItem(k))}); } } } catch {} return out.sort((a, b) => a.id < b.id ? -1 : 1); };
  const notify = p => { (subs.get("d:" + p) || new Set()).forEach(fn => fn(read(p), META)); const c = colOf(p); (subs.get("c:" + c) || new Set()).forEach(fn => fn(listCol(c), META)); };
  const sub = (key, fn, first) => { if (!subs.has(key)) subs.set(key, new Set()); subs.get(key).add(fn); setTimeout(() => fn(first(), META), 0); return () => { const s = subs.get(key); if (s) s.delete(fn); }; };
  return {
    online: false,
    get: async p => clone(read(p)),
    set: async (p, d) => { localStorage.setItem(PFX + p, JSON.stringify(d)); notify(p); },
    del: async p => { localStorage.removeItem(PFX + p); notify(p); },
    list: async c => clone(listCol(c)),
    watchDoc: (p, fn) => sub("d:" + p, fn, () => clone(read(p))),
    watchCol: (c, fn) => sub("c:" + c, fn, () => clone(listCol(c)))
  };
}

  if (role === "coord") return [["setup","Setup"],["compare","Agreement"],["export","Export"],["guide","Guide"]];
  if (role === "adj") return [["resolve","Resolve"],["compare","Agreement"],["export","Export"],["guide","Guide"]];
  if (isCoder(role)) return [["work","My coding"],["compare","Agreement"],["export","Export"],["guide","Guide"]];
  return [];
}
function render(){
  const snap = captureDrafts();
  st.pendingRender = false;
  const view = $("#view");
  document.body.dataset.role = st.role || "coord";
  const conn = $("#conn");
  conn.className = "conn " + (st.connecting ? "" : st.S && st.S.online ? "live" : "off");
  conn.lastElementChild.textContent = st.connecting ? "Connecting" : st.S && st.S.online ? "Shared workspace, live" : "Offline, this browser only";
  if (st.role && st.gatePassedFor === st.role && st.S && st.S.online && st.loaded.roles) {
    const r = st.roles[st.role];
    if (!r || !r.hash || ssGet("acb.ok." + st.role) !== r.hash) { st.gatePassedFor = null; ssSet("acb.ok." + st.role, null); }
  }
  const ok = st.role && st.gatePassedFor === st.role;
  $("#rolepill").innerHTML = ok ? `<span class="rolepill"><strong>${esc(ROLE[st.role].label)}</strong>${roleName(st.role) ? esc(roleName(st.role)) : ""}<button type="button" id="switchRole">Switch role</button></span>` : "";
  const tabs = $("#tabs");
  tabs.hidden = !ok;
  if (ok) {
    const list = tabsFor(st.role);
    if (!list.some(t => t[0] === st.tab)) st.tab = list[0][0];
    tabs.innerHTML = list.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${st.tab === k}">${esc(l)}</button>`).join("");
  }
  if (st.revoked) { view.innerHTML = `<div class="note bad">Access to this workspace changed while the page was open. Reload to continue.</div>`; return; }
  if (!ok) renderGate(view);
  else ({work: renderWork, compare: renderCompare, resolve: renderResolve, setup: renderSetup, export: renderExport, guide: renderGuide})[st.tab](view);
  restoreDrafts(snap);
  measureTop();
}

/* gate: pick a role, then a passphrase for that role */
function renderGate(view){
  if (st.role && !st.connecting) {
    if (!st.S.online) { st.gatePassedFor = st.role; return render(); }
    if (!st.loaded.roles) { view.innerHTML = `<p class="muted">Loading the workspace.</p>`; return; }
    const r = st.roles[st.role];
    if (r && r.hash && ssGet("acb.ok." + st.role) === r.hash) { st.gatePassedFor = st.role; return render(); }
    return renderPass(view, !!(r && r.hash), r);
  }
  const names = st.cfg.names || {};
  const loading = st.connecting || !st.loaded.cfg;
  const mode = st.cfg.mode === "A" ? "Re-coding the 33 studies in the submitted audit" : st.cfg.mode === "B" ? "Structured search with a random sample of " + (st.cfg.target || "N") + " studies" : loading ? "Loading" : "Scope not chosen yet";
  view.innerHTML = `
  <section class="intro">
    <div>
      <p class="eyebrow">Frontiers in Neuroscience 1953177 \u00b7 Reviewer 1, comment 3</p>
      <h1>Two coders, one codebook, no peeking</h1>
      <p class="lead">Each coder answers ${compFields("code").length} questions per study on their own. Neither sees the other's answers until both sheets are locked. The page then computes agreement, and the adjudicator settles every disagreement.</p>
      <div class="steps">
        <div><span>The coordinator sets the names and the paper list.</span></div>
        <div><span>Coder A and Coder B each code every paper and lock their sheet.</span></div>
        <div><span>Agreement (percent, Cohen's kappa, Gwet's AC1) appears for everyone.</span></div>
        <div><span>The adjudicator resolves disagreements; the consensus sheet is exported for the paper.</span></div>
      </div>
      <p class="small muted" style="margin-top:18px">Scope: ${esc(mode)} \u00b7 codebook v${CODEBOOK_VERSION} \u00b7 ${st.loaded.papers ? st.papers.length + " papers in the workspace" : "loading papers"}</p>
    </div>
    <div class="stack">
      <p class="eyebrow">Choose your role</p>
      <div class="roles">
        ${["A","B","adj","coord"].map(r => `<button type="button" class="rolecard ${r}" data-pick="${r}"><span class="rk"><i></i>${esc(ROLE[r].label)}</span><span class="nm">${esc(loading ? "Loading" : names[r] || "Not assigned")}</span><span class="ds">${esc(ROLE[r].desc)}</span></button>`).join("")}
      </div>
      <p class="small muted">Each role is protected by its own passphrase, set the first time somebody opens it.</p>
      ${!st.connecting && !st.S.online ? `<div class="note warn">The shared workspace is not available here, so answers stay in this browser. A coder working offline imports a work package from the coordinator, then exports a sheet to send back.</div>` : ""}
    </div>
  </section>`;
}
function renderPass(view, exists, r){
  const resets = (r && r.resets) || [];
  view.innerHTML = `
  <section class="panel" style="max-width:560px;margin:32px auto;padding:22px">
    <div class="stack">
      <p class="eyebrow">${esc(ROLE[st.role].label)}${roleName(st.role) ? " \u00b7 " + esc(roleName(st.role)) : ""}</p>
      <h2>${exists ? "Enter your passphrase" : "Set the passphrase for this role"}</h2>
      <p class="muted small">${exists ? "Every role has its own passphrase, so nobody opens another person's workspace by switching roles." : st.role === "coord" ? "The first person to open the coordinator role sets this passphrase. Set it before you share the link." : "Only you should open this role. Keep the passphrase safe: the coordinator can reset it, and every reset is logged and shown here."}</p>
      ${resets.length ? `<div class="note warn small">This passphrase was reset ${resets.length} time(s), most recently on ${esc(fmtTime(resets[resets.length - 1]))}. If you did not ask for that, tell the adjudicator before coding further.</div>` : ""}
      <form id="passForm" class="stack">
        <label class="fld">Passphrase<input type="password" id="pass1" data-draft="pass1" autocomplete="${exists ? "current-password" : "new-password"}" required minlength="6"></label>
        ${exists ? "" : `<label class="fld">Repeat passphrase<input type="password" id="pass2" data-draft="pass2" autocomplete="new-password" required minlength="6"></label>`}
        <div class="row"><button class="btn" type="submit">${exists ? "Open my workspace" : "Set passphrase and open"}</button><button class="btn ghost" type="button" id="backRoles">Choose another role</button></div>
      </form>
    </div>
  </section>`;
  if (!document.activeElement || !$("#view").contains(document.activeElement)) $("#pass1").focus();
}
async function submitPass(){
  const role = st.role, p1 = $("#pass1").value, p2El = $("#pass2");
  if (p1.length < 6) return toast("Use at least 6 characters.", "bad");
  const fresh = st.S.online ? await st.S.get("roles/" + role) : st.roles[role];
  if (fresh && fresh.hash) {
    const h = await sha256(fresh.salt + p1);
    if (h !== fresh.hash) return toast("That passphrase does not match. Ask the coordinator to reset it if it is lost.", "bad");
    ssSet("acb.ok." + role, h);
  } else {
    if (!p2El || p2El.value !== p1) return toast("The two passphrases differ.", "bad");
    const salt = randomHex(16), h = await sha256(salt + p1);
    await st.S.set("roles/" + role, {hash: h, salt, setAt: nowISO(), resets: (fresh && fresh.resets) || []});
    ssSet("acb.ok." + role, h);
    logEvent(ROLE[role].label + " set a passphrase");
  }
  st.gatePassedFor = role;
  st.roles[role] = st.roles[role] || {};
  render();
}

/* ------------------------------------------------------------------ coder workspace */
function currentStageForCoder(){
  const list = stages();
  if (!list.length) return null;
  let s = st.stagePicked ? stageById(st.stageId) : null;
  if (!s) s = list.find(x => !lockOf(x.id, st.role)) || list[list.length - 1];
  if (s.id !== st.stageId) { st.stageId = s.id; ssSet("acb.stage", s.id); }
  return s;
}
function paperStatus(pid){ const a = st.ans[pid]; if (!a) return ""; return a.done ? "done" : "prog"; }
function renderWork(view){
  if (!st.loaded.cfg || !st.loaded.papers || !st.loaded.locks) { view.innerHTML = `<p class="muted">Loading the workspace.</p>`; return; }
  const stage = currentStageForCoder();
  if (!stage) {
    view.innerHTML = `<div class="note">Nothing to code yet. ${!st.S.online ? "Working offline: import the work package from the coordinator under Export." : st.cfg.mode ? "The coordinator has not opened a screening round or frozen the coding sample." : "The coordinator has not chosen the audit scope."}</div>`;
    return;
  }
  watchAnswers(stage);
  const papers = stagePapers(stage);
  if (!st.pid || !papers.some(p => p.pid === st.pid)) st.pid = (papers.find(p => !(st.ans[p.pid] || {}).done) || papers[0] || {}).pid || null;
  const locked = lockOf(stage.id, st.role);
  const ready = st.ansLoaded === st.ansKey;
  const key = [stage.id, st.pid, locked ? "L" : "U", ready ? 1 : 0, papers.length, papers.map(p => p.pid).join(",").length].join("|");
  if (st.formKey === key && $("#workRoot")) { updateWorkChrome(); return; }

  const list = stages();

  view.innerHTML = `
  <div class="stack">
    <div class="row" style="justify-content:space-between">

          <select class="qselect" id="qselect" aria-label="Paper">${papers.map((p, i) => `<option value="${esc(p.pid)}" ${p.pid === st.pid ? "selected" : ""}>${({done:"\u2713 ", prog:"\u00b7 ", "":""})[paperStatus(p.pid)]}${i + 1}. ${esc(p.title).slice(0, 90)}</option>`).join("")}</select>
        </div>
        <div class="qlist" id="qlist">${papers.map((p, i) => `<button type="button" class="qitem" data-pid="${esc(p.pid)}" aria-current="${p.pid === st.pid}"><span class="dot" data-dot="${esc(p.pid)}"></span><span><span class="t">${esc(p.title)}</span><span class="m">${i + 1} \u00b7 ${esc(p.authors || "")} ${esc(p.year || "")}</span></span></button>`).join("")}</div>
      </aside>
      <section class="panel" id="formPanel">${!ready ? `<p class="muted" style="padding:20px">Loading your saved answers.</p>` : cur ? renderForm(stage, cur, !!locked) : `<p class="muted" style="padding:20px">No papers in this stage.</p>`}</section>
    </div>
  </div>`;

}
function renderForm(stage, p, locked){
  const a = st.ans[p.pid] || {v: {}};
  const v = a.v || {};
  st.formPid = p.pid; st.formBuiltV = JSON.stringify(v);
  const kind = stage.kind;
  const link = p.url || (p.doi ? "https://doi.org/" + p.doi : "");
  let html = `<div class="paperhead">
    <p class="eyebrow">${esc(p.pid)}${p.rank ? " \u00b7 rank " + p.rank : ""}</p>
    <h2 class="ptitle" id="paperTitle" tabindex="-1">${esc(p.title)}</h2>
    <p class="pmeta">${esc(p.authors || "")}${p.year ? " (" + esc(p.year) + ")" : ""}${p.venue ? " \u00b7 " + esc(p.venue) : ""}</p>
    <div class="row small">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">Open the paper</a>` : ""}${p.doi ? `<span class="mono muted">${esc(p.doi)}</span>` : ""}</div>
    ${kind === "screen" && p.abstract ? `<details class="abstract" open><summary>Abstract</summary><p style="margin-top:6px">${esc(p.abstract)}</p></details>` : ""}
  </div><form class="form" id="codeForm" autocomplete="off"><fieldset style="border:0;margin:0;padding:0;min-width:0" ${locked ? "disabled" : ""}>`;
  for (const g of CB[kind].groups) {
    const gHidden = g.when && !condOK(g.when, v);
    html += `<div class="grp" data-when='${esc(JSON.stringify(g.when || {}))}' ${gHidden ? "hidden" : ""}><h3>${esc(g.title)}</h3>${g.intro ? `<p class="gi">${esc(g.intro)}</p>` : ""}`;
    for (const f of g.fields) {
      const fHidden = f.when && !condOK(f.when, v);
      const id = "f_" + f.id;
      html += `<div class="q" data-field="${f.id}" data-when='${esc(JSON.stringify(f.when || {}))}' ${fHidden ? "hidden" : ""}>
        <span class="code">${f.type === "text" || f.type === "minutes" ? "" : esc(f.id)}</span>
        <span class="lbl" id="${id}_l">${esc(f.label)}${f.primary ? `<span class="pri">primary</span>` : ""}</span>
        ${f.rule ? `<p class="rule">${esc(f.rule)}</p>` : ""}
        <div class="ctl">`;
      if (f.type === "cat") {
        html += `<div class="opts" role="radiogroup" aria-labelledby="${id}_l">${f.options.map(([val, lab]) => `<label class="opt"><input type="radio" name="${f.id}" id="${id}_${esc(val)}" value="${esc(val)}" ${v[f.id] === val ? "checked" : ""}><span>${esc(lab)}</span></label>`).join("")}</div>`;
      } else if (f.type === "num") {
        html += `<input type="text" inputmode="decimal" id="${id}" name="${f.id}" value="${esc(v[f.id] ?? "")}" style="max-width:180px" aria-labelledby="${id}_l">`;
      } else if (f.type === "minutes") {
        html += `<input type="number" min="0" step="1" id="${id}" name="${f.id}" value="${esc(v[f.id] ?? "")}" style="max-width:140px" aria-labelledby="${id}_l">`;
      } else {
        html += `<textarea id="${id}" name="${f.id}" rows="2" aria-labelledby="${id}_l">${esc(v[f.id] ?? "")}</textarea>`;
      }
      html += `</div></div>`;
    }
    html += `</div>`;
  }
  html += `</fieldset></form>
  <div class="formfoot">
    <span class="save" id="saveState">${locked ? "Locked on " + esc(fmtTime(lockOf(stage.id, st.role).at)) : a.updatedAt ? "Saved " + esc(fmtTime(a.updatedAt)) : "Answers save as you go"}</span>
    <span class="missing" id="missing"></span>
    ${locked ? "" : `<button type="button" class="btn ghost sm" id="saveNow">Save now</button>`}
    <button type="button" class="btn ghost sm" id="prevPaper">Previous</button>
    ${locked ? "" : `<button type="button" class="btn sm" id="donePaper">${a.done ? "Done, next paper" : "Mark done and next"}</button>`}
    <button type="button" class="btn ghost sm" id="nextPaper">Next</button>
  </div>`;
  return html;
}
function readForm(stage){
  const form = $("#codeForm"); if (!form) return null;
  const v = {};
  for (const f of fields(stage.kind)) {
    if (f.type === "cat") { const c = form.querySelector(`input[name="${f.id}"]:checked`); if (c) v[f.id] = c.value; }
    else { const el = form.querySelector(`[name="${f.id}"]`); if (el && el.value.trim() !== "") v[f.id] = el.value.trim(); }
  }
  for (const f of fields(stage.kind)) if (!condOK(condOf(f), v)) delete v[f.id];
  return v;
}
function missingFor(stage, v){
  return fields(stage.kind).filter(f => (f.type === "cat" || (f.type === "num" && f.id === "H4")) && condOK(condOf(f), v) && blank(v[f.id])).map(f => f.id);
}
function applyVisibility(stage, v){
  document.querySelectorAll("#codeForm [data-when]").forEach(el => { const w = JSON.parse(el.dataset.when || "{}"); el.hidden = !condOK(w, v); });
}
const setSaveState = t => { const s = $("#saveState"); if (s) s.textContent = t; };
function scheduleSave(stage, markDone, immediate){
  const pid = st.pid, key = st.ansKey;
  const v = readForm(stage);
  if (!v || !pid || !key || st.ansLoaded !== key) return Promise.resolve();
  applyVisibility(stage, v);
  const miss = missingFor(stage, v);
  const prev = st.ans[pid] || {};
  const done = markDone ? miss.length === 0 : !!(prev.done && miss.length === 0);
  const doc = {v, done, updatedAt: nowISO(), codebook: CODEBOOK_VERSION, name: roleName(st.role)};
  st.ans[pid] = doc;
  st.dirty.add(key + "|" + pid);
  const seq = ++st.editSeq;
  setSaveState("Saving");
  const m = $("#missing"); if (m) m.textContent = miss.length ? miss.length + " unanswered: " + miss.join(", ") : "";
  clearTimeout(st.saveTimer);
  return new Promise(resolve => {
    st.saveTimer = setTimeout(async () => {
      st.saveTimer = null;
      if (lockOf(stage.id, st.role)) { toast("This sheet is locked, so the change was not saved.", "bad"); return resolve(); }
      try {
        await st.S.set(key + "/" + pid, doc);
        if (seq === st.editSeq) st.dirty.delete(key + "|" + pid);
        setSaveState("Saved " + fmtTime(doc.updatedAt));
        const papers = stagePapers(stage), n = papers.filter(p => (st.ans[p.pid] || {}).done).length;
        st.S.set("progress/" + stage.id + "-" + st.role, {done: n, total: papers.length, at: nowISO(), name: roleName(st.role)}).catch(() => {});
      } catch (e) {
        setSaveState("Not saved");
        toast("Could not save: " + msg(e) + ". Your answer is still on the page; press Save now to try again.", "bad");
      }
      updateWorkChrome(); resolve();
    }, markDone || immediate ? 0 : 700);
  });
}
function updateWorkChrome(){
  const stage = stageById(st.stageId); if (!stage || !$("#workRoot")) return;
  const papers = stagePapers(stage);
  const done = papers.filter(p => (st.ans[p.pid] || {}).done).length;
  const q = $("#qcount"); if (q) q.textContent = done + " / " + papers.length + " done";
  const b = $("#qbar"); if (b) b.style.width = (papers.length ? 100 * done / papers.length : 0) + "%";
  document.querySelectorAll("[data-dot]").forEach(d => { d.className = "dot " + paperStatus(d.dataset.dot); });
  const la = $("#lockArea"); if (!la) return;
  const lock = lockOf(stage.id, st.role);
  const unsaved = [...st.dirty].some(k => k.startsWith(st.ansKey + "|"));
  la.innerHTML = lock
    ? `<span class="chip ok">Locked ${esc(fmtTime(lock.at))}</span><span class="chip mono">${esc(lock.fp)}</span>`
    : `<span class="small muted">${done === papers.length && papers.length ? (unsaved ? "Waiting for the last answers to save." : "All papers done.") : "Lock becomes available when every paper is done."}</span><button type="button" class="btn sm" id="lockBtn" ${done === papers.length && papers.length && !unsaved ? "" : "disabled"}>Lock my sheet</button>`;
}
async function fingerprint(ans, pids){
  const canon = o => Object.keys(o || {}).sort().reduce((acc, k) => { if (!blank(o[k])) acc[k] = o[k]; return acc; }, {});
  return (await sha256(JSON.stringify(pids.map(pid => [pid, canon((ans[pid] || {}).v)])))).slice(0, 16);
}
async function lockSheet(){
  const stage = stageById(st.stageId); if (!stage || !isCoder(st.role)) return;
  await flushSave();
  const pids = stagePapers(stage).map(p => p.pid);
  if (pids.some(pid => !(st.ans[pid] || {}).done)) return toast("Every paper must be marked done before locking.", "bad");
  if ([...st.dirty].some(k => k.startsWith(st.ansKey + "|"))) return toast("Some answers have not reached the workspace yet. Press Save now, wait for Saved, then lock.", "bad");
  const ok = await confirmTyped("Lock your sheet?", `After locking you cannot change any answer in ${stage.label}. When both coders have locked, everyone sees the agreement and the adjudicator sees both sheets.`, "LOCK");
  if (!ok) return;
  await flushSave();
  const server = Object.fromEntries((await st.S.list(st.ansKey)).map(x => [x.id, x.data]));
  if (pids.some(pid => !(server[pid] || {}).done)) return toast("The saved sheet does not have every paper marked done. Check the queue and try again.", "bad");
  const fpServer = await fingerprint(server, pids), fpPage = await fingerprint(st.ans, pids);
  if (fpServer !== fpPage) return toast("Some answers on this page differ from the saved sheet. Press Save now, wait for Saved, then lock again.", "bad");
  await st.S.set("locks/" + stage.id + "-" + st.role, {at: nowISO(), name: roleName(st.role), n: pids.length, fp: fpServer, codebook: CODEBOOK_VERSION});
  logEvent(`${ROLE[st.role].label} locked ${stage.label}: ${pids.length} papers, fingerprint ${fpServer}`);
  toast("Sheet locked.");
}
async function flushSave(){
  if (st.tab !== "work" || !$("#codeForm")) return;
  const stage = stageById(st.stageId);
  if (!stage || lockOf(stage.id, st.role)) return;
  if (st.saveTimer) { clearTimeout(st.saveTimer); st.saveTimer = null; }
  await scheduleSave(stage, false, true);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSave(); });
window.addEventListener("pagehide", () => { flushSave(); });

/* ------------------------------------------------------------------ agreement */
function kappaStats(a, b, cats){
  const n = a.length; if (!n) return {n: 0};
  const po = a.filter((x, i) => x === b[i]).length / n;
  if (cats.length < 2) return {n, po, kappa: NaN, ac1: NaN};
  const pa = c => a.filter(x => x === c).length / n, pb = c => b.filter(x => x === c).length / n;
  const pe = cats.reduce((s, c) => s + pa(c) * pb(c), 0);
  const kappa = pe >= 1 ? NaN : (po - pe) / (1 - pe);
  const K = cats.length, pi = cats.map(c => (pa(c) + pb(c)) / 2);
  const peG = pi.reduce((s, p) => s + p * (1 - p), 0) / (K - 1);
  const ac1 = peG >= 1 ? NaN : (po - peG) / (1 - peG);
  return {n, po, kappa, ac1};
}
async function loadCompare(stage, force){
  if (!stage || !bothLocked(stage.id) || !st.loaded.papers) { if (force) st.cmp = null; return; }
  const pidsSig = stagePapers(stage).map(p => p.pid).join(",");
  const la = lockOf(stage.id, "A"), lb = lockOf(stage.id, "B");
  if (!force && st.cmp && st.cmp.stageId === stage.id && st.cmp.lockA === la.at && st.cmp.lockB === lb.at && st.cmp.pidsSig === pidsSig) return;
  const [da, db] = await Promise.all([st.S.list("ans-" + stage.id + "-A"), st.S.list("ans-" + stage.id + "-B")]);
  const A = Object.fromEntries(da.map(x => [x.id, x.data])), B = Object.fromEntries(db.map(x => [x.id, x.data]));
  const pids = stagePapers(stage).map(p => p.pid);
  const [fa, fb] = await Promise.all([fingerprint(A, pids), fingerprint(B, pids)]);
  st.cmp = {stageId: stage.id, A, B, pidsSig, lockA: la.at, lockB: lb.at, fpOkA: fa === la.fp, fpOkB: fb === lb.fp};
}
const cmpFresh = stage => !!(st.cmp && stage && st.cmp.stageId === stage.id && st.cmp.pidsSig === stagePapers(stage).map(p => p.pid).join(",") && st.cmp.lockA === (lockOf(stage.id, "A") || {}).at && st.cmp.lockB === (lockOf(stage.id, "B") || {}).at);
function agreementRows(stage){
  const pids = stagePapers(stage).map(p => p.pid), A = st.cmp.A, B = st.cmp.B;
  return compFields(stage.kind).map(f => {
    const cond = condOf(f), xa = [], xb = []; let numN = 0, numMatch = 0, oneSided = 0;

    if (!Object.keys(cond).every(k => finalValue(stage, pid, k) === cond[k])) continue;

    if (sameVal(f, va[f.id], vb[f.id]) && !unsure) continue;

async function importFrame(){
  const files = [...($("#frameFiles").files || [])];
  if (!files.length) return toast("Choose one or more export files first.", "bad");
  if (st.frame) return toast("A search frame is already imported.", "bad");
  const seed = parseInt(st.cfg.seed || 20260914, 10);
  const recs = [], sources = [];
  for (const file of files) {
    const rows = parseDelimited(await file.text());
    if (rows.length < 2) continue;
    const h = rows[0].map(x => x.trim().toLowerCase());
    const col = (...names) => names.map(n => h.indexOf(n)).find(i => i >= 0);
    const ix = {title: col("title", "ti", "article title", "document title"), authors: col("authors", "au", "author full names", "author(s)"), year: col("year", "py", "publication year"), venue: col("source title", "so", "journal", "publication title"), doi: col("doi", "di"), abstract: col("abstract", "ab")};
    if (ix.title === undefined) { toast(file.name + ": no title column found.", "bad"); continue; }
    let n = 0;
    for (const r of rows.slice(1)) {
      const g = k => ix[k] === undefined ? "" : (r[ix[k]] || "").trim();
      if (!g("title")) continue;
      const aus = g("authors"), au = aus.split(/;|\s{2,}/)[0].split(",")[0].trim();
      recs.push({title: g("title"), authors: au ? au + (aus.includes(";") ? " et al." : "") : "", year: parseInt(g("year"), 10) || "", venue: g("venue"), doi: g("doi").replace(/^https?:\/\/(dx\.)?doi\.org\//i, "").toLowerCase(), abstract: g("abstract").slice(0, 4000), from: file.name});
      n++;
    }
    sources.push({name: file.name, rows: n});
  }
  if (!recs.length) return toast("No records were read from the files.", "bad");
  const byKey = new Map();
  for (const r of recs) { const k = dedupKey(r); if (!byKey.has(k)) byKey.set(k, r); }
  const byTitle = new Map();
  for (const [k, r] of [...byKey.entries()]) {
    const t = normTitle(r.title) || String(r.title).toLowerCase().trim();
    const prev = byTitle.get(t);
    if (!prev) { byTitle.set(t, {k, r}); continue; }
    if (!prev.r.doi && r.doi) { byKey.delete(prev.k); byTitle.set(t, {k, r}); }
    else if (prev.r.doi && !r.doi) byKey.delete(k);
  }
  const uniq = [...byKey.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(x => x[1]);
  const rnd = mulberry32(seed);
  for (let i = uniq.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [uniq[i], uniq[j]] = [uniq[j], uniq[i]]; }
  const ok = await confirmTyped("Import the search frame?", `${uniq.length} unique records (${recs.length - uniq.length} duplicates removed), shuffled with seed ${seed}. The frame cannot be replaced afterwards.`, "IMPORT");
  if (!ok) return;
  const CH = 40, chunks = Math.ceil(uniq.length / CH);
  for (let c = 0; c < chunks; c++) await st.S.set("frame/c" + String(c).padStart(4, "0"), {papers: uniq.slice(c * CH, (c + 1) * CH)});
  await st.S.set("config/frame", {n: uniq.length, duplicates: recs.length - uniq.length, seed, chunk: CH, chunks, sources, importedAt: nowISO()});
  logEvent(`Imported search frame: ${uniq.length} unique of ${recs.length} records, seed ${seed}, from ${sources.map(s => s.name).join(", ")}`);
  toast("Frame imported.");
}
async function startRound(){
  const frame = st.frame; if (!frame) return;
  const rounds = st.cfg.rounds || [];
  if (st.sample) return toast("The coding sample is already frozen.", "bad");
  if (rounds.length && !bothLocked("screen-" + rounds.length)) return toast("Both coders must lock the current round first.", "bad");
  const size = Math.max(10, Math.min(300, parseInt(($("#roundSize") || {}).value, 10) || 60));
  const from = rounds.length ? rounds[rounds.length - 1].to + 1 : 1, to = Math.min(frame.n, from + size - 1);
  if (from > frame.n) return toast("Every record in the frame has been screened.", "bad");
  const btn = $("#startRound"); if (btn) btn.disabled = true;
  const need = new Set(); for (let r = from; r <= to; r++) need.add(Math.floor((r - 1) / frame.chunk));
  const byChunk = {};
  for (const c of need) byChunk[c] = ((await st.S.get("frame/c" + String(c).padStart(4, "0"))) || {}).papers || [];
  const work = [];
  for (let r = from; r <= to; r++) { const p = (byChunk[Math.floor((r - 1) / frame.chunk)] || [])[(r - 1) % frame.chunk]; if (p) work.push(["papers/R" + String(r).padStart(4, "0"), {...p, rank: r, source: "search"}]); }

  toast(`Round ${rounds.length + 1} open: ranks ${from} to ${to}.`);
}
async function freezeSample(){

  if (st.sample) return toast("The coding sample is already frozen.", "bad");
  const eligible = [];
  for (const s of screenStages) {
    const [la, lb, lc] = await Promise.all([st.S.list("ans-" + s.id + "-A"), st.S.list("ans-" + s.id + "-B"), st.S.list("cons-" + s.id)]);
    const A = Object.fromEntries(la.map(x => [x.id, x.data])), B = Object.fromEntries(lb.map(x => [x.id, x.data])), C = Object.fromEntries(lc.map(x => [x.id, x.data]));
    for (const p of stagePapers(s)) {
      const a = ((A[safeId(p.pid)] || {}).v || {}).E1, b = ((B[safeId(p.pid)] || {}).v || {}).E1;
      const c = (((C[safeId(p.pid)] || {}).v || {}).E1 || {}).value;
      const fin = c || (a === b && a !== "unsure" ? a : null);
      if (!fin) return toast(`${s.label}: the screening decision for ${p.pid} is still unresolved.`, "bad");
      if (fin === "eligible") eligible.push(p.pid);
    }
  }

  if (eligible.length < target && lastTo < (st.frame || {}).n) return toast(`Only ${eligible.length} eligible so far; open another round to reach ${target}.`, "bad");
  const pids = eligible.slice(0, target);
  const ok = await confirmTyped("Freeze the coding sample?", `${pids.length} studies: the first ${pids.length} eligible by rank, out of ${eligible.length} eligible among ranks 1 to ${lastTo}. Coding then opens for both coders.`, "FREEZE");
  if (!ok) return;
  await st.S.set("config/sample", {pids, target, eligibleSeen: eligible.length, screenedTo: lastTo, frozenAt: nowISO()});

}

function showModal(html){
  const s = document.createElement("div"); s.className = "scrim"; s.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(s);
  s.addEventListener("click", e => { if (e.target === s || e.target.closest("[data-close]")) s.remove(); if (e.target.closest("[data-copy]")) { const t = s.querySelector("textarea"); t.focus(); t.select(); } });
  const f = s.querySelector("input,textarea,button"); if (f) f.focus();

}
function confirmTyped(title, body, word){
  return new Promise(resolve => {
    const s = showModal(`<h2>${esc(title)}</h2><p>${esc(body)}</p><label class="fld">Type ${esc(word)} to confirm<input type="text" id="confirmWord" autocomplete="off"></label><div class="row"><button class="btn" type="button" id="confirmGo">Confirm</button><button class="btn ghost" type="button" id="confirmNo">Cancel</button></div>`);
    let done = false;
    const finish = v => { if (done) return; done = true; document.removeEventListener("keydown", onKey, true); s.remove(); resolve(v); };
    const tryGo = () => { if ($("#confirmWord", s).value.trim().toUpperCase() === word) finish(true); else toast("Type " + word + " to confirm.", "bad"); };
    const onKey = e => { if (!document.body.contains(s)) return; if (e.key === "Escape") { e.preventDefault(); finish(false); } else if (e.key === "Enter" && s.contains(document.activeElement)) { e.preventDefault(); tryGo(); } };
    document.addEventListener("keydown", onKey, true);
    $("#confirmGo", s).onclick = tryGo;
    $("#confirmNo", s).onclick = () => finish(false);
    s.addEventListener("click", e => { if (e.target === s) finish(false); });
    $("#confirmWord", s).focus();
  });
}

    await flushSave();
    ssSet("acb.ok." + st.role, null);
    st.role = null; lsSet("acb.role", null); st.gatePassedFor = null; st.formKey = null; st.cmp = null; st.tab = null;
    watchAnswers(null); watchCons(null); render(); return;
  }
  if (t.closest("#backRoles")) { st.role = null; lsSet("acb.role", null); render(); return; }
  const tab = t.closest("[data-tab]");
  if (tab) { if (st.tab === "work") await flushSave(); st.tab = tab.dataset.tab; st.formKey = null; st.focusTarget = `[data-tab="${cssq(tab.dataset.tab)}"]`; render(); return; }
  const q = t.closest("[data-pid]");
  if (q) { await flushSave(); st.pid = q.dataset.pid; st.formKey = null; st.focusTarget = "#paperTitle"; render(); return; }
  if (t.closest("#saveNow")) { await flushSave(); return; }
  const done = t.closest("#donePaper");
  if (done) {
    done.disabled = true;
    const stage = stageById(st.stageId);
    await scheduleSave(stage, true, true);
    const a = st.ans[st.pid];
    done.disabled = false;
    if (!a || !a.done) return toast("Answer every question first: " + missingFor(stage, a ? a.v : {}).join(", "), "bad");
    movePaper(1); return;
  }
  if (t.closest("#nextPaper")) { await flushSave(); movePaper(1); return; }
  if (t.closest("#prevPaper")) { await flushSave(); movePaper(-1); return; }
  if (t.closest("#lockBtn")) { guard(lockSheet(), "Could not lock"); return; }
  const rp = t.closest("[data-rpid]"); if (rp) { st.resolvePid = rp.dataset.rpid; st.focusTarget = "#paperTitle"; render(); return; }
  const sr = t.closest("[data-save-res]"); if (sr) { guard(saveResolution(sr.dataset.saveRes, sr.closest("[data-res]")), "Could not save the decision"); return; }
  const ex = t.closest("[data-exp]"); if (ex) { guard(doExport(ex.dataset.exp), "Export failed"); return; }
  if (t.closest("#importFrame")) { guard(importFrame(), "Import failed"); return; }
  if (t.closest("#startRound")) { guard(startRound(), "Could not open the round"); return; }
  if (t.closest("#freezeSample")) { guard(freezeSample(), "Could not freeze the sample"); return; }
  if (t.closest("#importSheet")) { guard(importSheet(), "Import failed"); return; }
  if (t.closest("#importPkg")) { guard(importPkg(), "Import failed"); return; }
  const ro = t.closest("[data-reopen]");
  if (ro) {
    const id = ro.dataset.reopen, sid = id.replace(/-(A|B)$/, ""), r = id.slice(-1);
    if (lockOf(sid, other(r))) return toast("The other coder has locked, so reopening now would break independence.", "bad");
    const ok = await confirmTyped("Reopen this sheet?", `${ROLE[r].label} will be able to change answers in ${(stageById(sid) || {}).label || sid}. The reopen is logged.`, "REOPEN");
    if (!ok) return;
    const fresh = await st.S.get("locks/" + sid + "-" + other(r));
    if (fresh) return toast("The other coder locked while you were confirming, so the sheet was not reopened.", "bad");
    const old = lockOf(sid, r);
    await st.S.del("locks/" + id);
    logEvent(`Reopened ${ROLE[r].label}'s sheet for ${sid} (locked ${old ? old.at : "?"}, fingerprint ${old ? old.fp : "?"})`);
    return;
  }
  const rs = t.closest("[data-resetpass]");
  if (rs) {
    const r = rs.dataset.resetpass;
    const ok = await confirmTyped(`Reset ${ROLE[r].label}'s passphrase?`, "They set a new one the next time they open the page. The reset is logged, counted on the Agreement page and shown to them.", "RESET");
    if (!ok) return;
    const cur = (await st.S.get("roles/" + r)) || {};
    await st.S.set("roles/" + r, {resets: [...(cur.resets || []), nowISO()]});
    logEvent(`Reset ${ROLE[r].label}'s passphrase`);
    return;
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, id = form.id;
  const clean = () => form.querySelectorAll("[data-dirty]").forEach(el => delete el.dataset.dirty);
  if (id === "passForm") return guard(submitPass(), "Could not open the workspace");
  if (id === "namesForm") {
    const names = {}; for (const r of ["A", "B", "adj", "coord"]) names[r] = $("#name_" + r).value.trim();
    const people = [names.A, names.B, names.adj].filter(Boolean).map(x => x.toLowerCase());
    if (new Set(people).size !== people.length) return toast("Coder A, Coder B and the adjudicator must be different people.", "bad");
    clean();
    return guard(cfgWrite({names}, "Saved names: " + ["A", "B", "adj", "coord"].map(r => ROLE[r].label + " " + (names[r] || "unassigned")).join(", ")).then(() => toast("Names saved.")), "Could not save");
  }
  if (id === "scopeForm") {
    const m = form.querySelector("input[name=mode]:checked");
    const target = parseInt($("#target").value, 10) || 45, seed = parseInt($("#seed").value, 10) || 20260914;
    clean();
    return guard(cfgWrite({mode: m ? m.value : st.cfg.mode || null, target, seed}, `Saved scope: option ${m ? m.value : "unset"}, sample ${target}, seed ${seed}`).then(() => toast("Scope saved.")), "Could not save");
  }
  if (id === "addPaper") {
    const title = $("#ap_title").value.trim(); if (!title) return;
    const au = $("#ap_authors").value.trim(), yr = parseInt($("#ap_year").value, 10) || "";
    const doi = $("#ap_doi").value.trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, "");
    const base = safeId((au.split(/[ ,]/)[0] || "Paper") + yr);
    let pid = base, k = 2; while (st.papers.some(p => p.pid === pid)) pid = base + "-" + k++;
    const rank = Math.max(0, ...st.papers.map(p => p.rank || 0)) + 1;
    clean();
    form.reset();
    return guard(st.S.set("papers/" + pid, {title, authors: au, year: yr, venue: $("#ap_venue").value.trim(), doi, url: doi ? "https://doi.org/" + doi : "https://scholar.google.com/scholar?q=" + encodeURIComponent(title), rank, source: "manual"}).then(() => { logEvent(`Added paper ${pid}: ${title}`); toast("Paper added."); }), "Could not add the paper");
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "stageSel") { st.stagePicked = true; flushSave().then(() => { st.stageId = t.value; ssSet("acb.stage", t.value); st.pid = null; st.formKey = null; render(); }); return; }
  if (t.id === "qselect") { flushSave().then(() => { st.pid = t.value; st.formKey = null; st.focusTarget = "#paperTitle"; render(); }); return; }
  if (t.id === "cmpStage") { st.cmpStageId = t.value; render(); return; }
  if (t.id === "resStage") { st.resStageId = t.value; st.resolvePid = null; render(); return; }
  if (t.id === "resSelect") { st.resolvePid = t.value; render(); return; }
  if (t.id === "expStage") { st.expStageId = t.value; render(); return; }
  if (t.closest("#codeForm")) scheduleSave(stageById(st.stageId), false);
});
document.addEventListener("input", e => { if (e.target.closest("#codeForm") && e.target.matches("input[type=text],input[type=number],textarea")) scheduleSave(stageById(st.stageId), false); });

boot();
</script>
